# Dependabot Configuration
# This file configures automated dependency updates for the project
# It monitors both npm packages and GitHub Actions for updates
# Updates are scheduled to run weekly to maintain a balance between staying current and avoiding excessive PRs
# For more configuration options, see: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Monitor and update npm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    # Group all dev dependencies into a single PR to reduce noise
    groups:
      dev-dependencies:
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
      # Dev-dependency majors land in one self-updating PR instead of one PR per
      # package and version. They are still merged by hand (ADR 0002): grouped
      # PRs report their highest update type, so auto-merge skips this group.
      dev-dependencies-major:
        dependency-type: 'development'
        update-types:
          - 'major'
    # Limit to 5 open PRs at a time to avoid overwhelming CI
    open-pull-requests-limit: 5
    ignore:
      # @types/node follows the action runtime (`runs.using: node24` in
      # action.yml), not the latest Node LTS. Newer types would accept APIs that
      # are missing at runtime. The GitHub Actions runner does not ship node26
      # yet; lift this together with the runtime switch tracked in #316 (which
      # also bumps .node-version, the dev/CI Node pin).
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      # typescript-eslint's peer range caps typescript at <6.1.0. Lift this once
      # typescript-eslint supports newer TypeScript (incl. the native TS 7).
      - dependency-name: 'typescript'
        versions:
          - '>=6.1.0'

  # Monitor and update GitHub Actions
  - package-ecosystem: 'github-actions'
    # `/` covers .github/workflows and the root action.yml only; the composite
    # actions under .github/actions pin their own action SHAs.
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'weekly'
    # Group all GitHub Actions updates into a single PR
    groups:
      github-actions:
        patterns:
          - '*'
