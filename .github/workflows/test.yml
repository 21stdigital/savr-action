name: Test

on:
  pull_request:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number for concurrency grouping
        required: false
        type: string
      head_sha:
        description: PR head SHA to validate
        required: true
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: test-${{ github.event.pull_request.number || inputs.pr_number || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.pull_request.head.sha }}

    steps:
      - name: Set pending commit status
        if: github.event_name == 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ inputs.head_sha }}',
              state: 'pending',
              context: 'Test',
              description: 'Running...',
            });

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Surface a rebuilt dist/ to the privileged commit-dist.yml workflow via an
      # artifact. This job has no write token, so it can safely run PR code; the
      # artifact is the only thing handed to the privileged side. See
      # docs/adr/0001-dist-rebuild-split-flow.md. The check also runs on the
      # re-dispatched run, where it feeds the stale-dist/ gate at the end of the job.
      - name: Check whether dist/ changed
        id: dist-check
        run: |
          # --porcelain catches modified, deleted and untracked files, so a build
          # that removes or adds a dist/ file is detected, not just modifications.
          if [ -n "$(git status --porcelain -- dist/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload rebuilt dist/
        if: github.event_name == 'pull_request' && steps.dist-check.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-rebuild
          path: dist/
          retention-days: 1

      # The local `pnpm check` is build + `pnpm verify`. CI splits them only so the
      # dist/ artifact above is uploaded before any gate can fail. The gates
      # themselves are defined once, in the `verify` script in package.json.
      - name: Verify
        run: pnpm verify

      # Deliberately after the upload: the dist/ artifact already exists, so a red
      # audit still lets commit-dist.yml sync dist/ (which does not gate on
      # conclusion). Catches advisories the Dependabot board misses -- the two
      # databases disagreed on four advisories, see #290.
      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      # Gate (ADR 0005): fail while the committed dist/ differs from the build, so
      # no merge -- auto-merge included -- lands before the rebuilt bundle. Same-repo
      # PRs heal on their own: commit-dist.yml pushes the artifact uploaded above
      # and re-dispatches this workflow. Last and on !cancelled() so every other
      # gate still reports; before the final status so a failure reaches it.
      - name: Fail if dist/ is stale
        if: ${{ !cancelled() && steps.dist-check.outcome == 'success' }}
        env:
          DIST_CHANGED: ${{ steps.dist-check.outputs.changed }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$DIST_CHANGED" != 'true' ]; then
            echo "dist/ matches the build."
            exit 0
          fi
          echo "Files in dist/ that differ from the build:"
          git status --porcelain -- dist/
          git --no-pager diff --stat -- dist/
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            msg="dist/ differs from the build on a dispatched run. If commit-dist.yml started it, its rebuild did not converge and the build may not be deterministic. Run \`pnpm build\` locally and investigate (see #326)."
          elif [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            msg="dist/ differs from the build, and CI cannot push to forks. Run \`pnpm build\` and commit dist/."
          else
            msg="dist/ differs from the build. commit-dist.yml will push the rebuilt dist/ and re-run Test; no action needed. To skip the wait, run \`pnpm build\` and commit dist/."
          fi
          echo "::error title=Stale dist/::$msg"
          exit 1

      - name: Set final commit status
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const stateMap = { success: 'success', failure: 'failure', cancelled: 'error' };
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ inputs.head_sha }}',
              state: stateMap['${{ job.status }}'] || 'error',
              context: 'Test',
              description: '${{ job.status }}',
            });
