# pnpm settings live here as of pnpm 10+/11 (the package.json "pnpm" field and several
# .npmrc keys such as save-exact / engine-strict are no longer read from those locations).

# Fail the install if the local Node version doesn't satisfy package.json "engines".
engineStrict: true

# Save exact dependency versions (no ^ ranges) when adding packages.
saveExact: true

# Dependencies permitted to run install/build scripts (pnpm blocks all others).
# pnpm 11 replaced onlyBuiltDependencies with this map (package matcher -> true|false).
allowBuilds:
  esbuild: true

# Dependency overrides pin transitive packages to non-vulnerable versions.
#
# A pin earns its place only if it currently changes resolution. Pins that no
# longer do are not inert: with no version selector they keep overriding the
# declared spec, which is how vite silently ran 7.3.6 against a declared 8.1.0
# (#292) and how fast-uri was pushed across a major it did not need (#288).
# Regressions are caught by the `pnpm audit` gate in test.yml (#291), so stale
# defensive floors buy nothing that the gate does not already cover.
#
# Verified by stripping every pin, reinstalling and auditing: only the two below
# change anything. The other sixteen were dead.
overrides:
  # Load-bearing, and deliberately crosses a major on a RUNTIME dependency.
  # @actions/github declares undici ^6.23.0, which resolves to 6.28.0 -- the last
  # 6.x release. No patched 6.x exists, so the only non-vulnerable option is 7.x.
  # This one ships: undici is bundled into dist/index.js.
  'undici': '^7.29.0'
  # Load-bearing (low severity, dev-only).
  'esbuild@<0.28.1': '>=0.28.1'
